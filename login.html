<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECKED - Log in</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/decked-favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/decked-favicon-180.png">
    <link rel="stylesheet" href="css/style.css?v=20261112">
</head>
<body>

    <div data-layout="header"></div>

    <main class="auth-page">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-photo">
                    <img src="images/lifestyle/lifestyle-apparel-banner.jpg" alt="">
                    <div class="auth-photo-overlay"></div>
                    <div class="auth-photo-content">
                        <div class="auth-photo-heading">Members ride first.</div>
                        <div class="auth-photo-sub">Save your cart, track your orders, and never miss a drop.</div>
                    </div>
                </div>

                <div class="auth-form-side">
                    <div class="auth-tabs">
                        <button type="button" class="auth-tab is-active" id="tabLogin">Log in</button>
                        <button type="button" class="auth-tab" id="tabRegister">Create account</button>
                    </div>

                    <h1 class="auth-title" id="authTitle">Welcome back.</h1>
                    <p class="auth-sub" id="authSub">Log in to pick up where you left off.</p>

                    <form class="auth-form" id="authForm">
                        <label class="auth-field" id="nameField" style="display:none;">
                            <span class="auth-field-label">Name</span>
                            <input type="text" name="name" autocomplete="name" placeholder="Jordan Vega">
                        </label>
                        <label class="auth-field">
                            <span class="auth-field-label">Email</span>
                            <input type="email" name="email" autocomplete="email" placeholder="you@email.com" required>
                        </label>
                        <label class="auth-field">
                            <span class="auth-field-label">Password</span>
                            <input type="password" name="password" autocomplete="current-password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" required>
                        </label>
                        <div class="auth-error" id="authError" style="display:none;"></div>
                        <button type="submit" class="auth-submit" id="authSubmit">Log in</button>
                    </form>
                    <p class="auth-disclaimer">Demo only. Your details stay in this browser and are never sent.</p>
                </div>
            </div>
        </div>
    </main>

    <div data-layout="footer"></div>
    <div data-layout="cart"></div>

    <script src="js/products.js"></script>
    <script src="js/store.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
