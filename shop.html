<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECKED - Shop</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/decked-favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/decked-favicon-180.png">
    <link rel="stylesheet" href="css/style.css?v=20261003">
</head>
<body>

    <div data-layout="header"></div>

    <main style="background:#FEFDF5;">
        <section class="shop-page">
            <span class="shop-breadcrumb" id="shopBreadcrumb">// Shop / Shop everything</span>
            <div class="shop-title-row">
                <h1 class="shop-title" id="shopTitle">Shop everything</h1>
                <span class="shop-count" id="shopCount"></span>
            </div>

            <div id="shopBanner"></div>

            <div class="category-pills" id="categoryPills"></div>

            <div class="product-grid" id="productGrid"></div>
        </section>
    </main>

    <div data-layout="footer"></div>

    <div data-layout="cart"></div>

    <script src="js/products.js"></script>
    <script src="js/store.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/shop.js"></script>

</html>
